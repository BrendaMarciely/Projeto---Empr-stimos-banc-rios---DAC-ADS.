<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Empréstimos | Impulso Financeiro</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="emprestimos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        /* Estilos do Modal (Seguindo o padrão de Usuários) */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background-color: #fff;
            margin: 5% auto;
            border-radius: 16px;
            width: 450px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: slideIn 0.3s ease-out;
            overflow: hidden;
        }

        @keyframes slideIn {
            from { transform: translateY(-30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            padding: 20px;
            background: #fff;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-icon-container {
            width: 45px;
            height: 45px;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 15px;
        }

        .modal-header h3 { margin: 0; color: #1e293b; font-size: 18px; }
        .modal-header p { margin: 0; color: #64748b; font-size: 13px; }

        .form-group { padding: 10px 25px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #334155; font-size: 14px; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .modal-footer-improved {
            padding: 20px 25px;
            background: #f8fafc;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn-save { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-cancel { background: white; color: #64748b; border: 1px solid #e2e8f0; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .close-btn { background: none; border: none; font-size: 24px; color: #94a3b8; cursor: pointer; }
    </style>
</head>

<body>

    <div class="layout">
        <aside class="sidebar">
            <div class="logo">
                <div id="btn-expandir" onclick="toggleSidebar()" style="cursor: pointer;">
                    <i class="fa-solid fa-bars" id="btn-icon"></i>
                </div>
                <span>Impulso Financeiro</span>
            </div>
            
            <nav>
                <a href="dashboard.html"><i class="fa-solid fa-table-columns"></i><span>Dashboard</span></a>
                <a href="usuarios.html"><i class="fa-solid fa-users"></i><span>Cadastro</span></a>
                <a href="financeiras.html"><i class="fa-solid fa-building-columns"></i><span>Financeiras</span></a>
                <a href="emprestimos.html" class="active"><i class="fa-solid fa-hand-holding-dollar"></i><span>Empréstimos</span></a>
                <a href="notificacoes.html"><i class="fa-solid fa-bell"></i><span>Notificações</span></a>
                <a href="relatorios.html"><i class="fa-solid fa-chart-column"></i><span>Relatórios</span></a>
            </nav>

            <div class="logout">
                <a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i><span>Sair</span></a>
            </div>
        </aside>

        <main class="content">
            <div class="header">
                <h1>Gestão de Empréstimos</h1>
                <button class="btn-add" onclick="window.location.href='cadastro-emprestimo.html'">
                    <i class="fa-solid fa-plus"></i> Cadastrar Empréstimo
                </button>
            </div>

            <div class="filters">
                <div class="search">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" placeholder="Buscar por credor..." id="buscaCredor">
                </div>
                
                <select id="filtroStatus" class="filtro-status">
                    <option value="todos">Todos</option>
                    <option value="ativo">Ativo</option>
                    <option value="encerrado">Encerrado</option>
                </select>

                <button class="btn-pdf" onclick="gerarPDFEmprestimos()" style="margin-left: 10px; cursor: pointer;">
                    <i class="fa-solid fa-file-pdf"></i> Gerar PDF
                </button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Credor</th>
                        <th>Valor</th>
                        <th>Taxa</th>
                        <th>Início</th>
                        <th>Término</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaEmprestimos"></tbody>
            </table>
        </main>
    </div>

    <div id="modalEditar" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div style="display: flex; align-items: center;">
                    <div class="header-icon-container"><i class="fa-solid fa-pen-to-square"></i></div>
                    <div>
                        <h3>Editar Empréstimo</h3>
                        <p>Atualize as informações do contrato.</p>
                    </div>
                </div>
                <button class="close-btn" onclick="fecharModal()">&times;</button>
            </div>

            <form id="formEditar">
                <input type="hidden" id="editId">
                
                <div class="form-group">
                    <label>Valor do Empréstimo (R$) <span style="color:red">*</span></label>
                    <input type="text" id="editValor" oninput="formatarMoeda(this)" required>
                </div>

                <div class="form-group">
                    <label>Taxa de Juros (% a.a.) <span style="color:red">*</span></label>
                    <input type="text" id="editTaxa" oninput="formatarTaxa(this)" required>
                </div>

                <div class="form-group">
                    <label>Status do Contrato <span style="color:red">*</span></label>
                    <select id="editStatus">
                        <option value="Ativo">Ativo</option>
                        <option value="Encerrado">Encerrado</option>
                    </select>
                </div>

                <div class="modal-footer-improved">
                    <button type="submit" class="btn-save"><i class="fa-solid fa-floppy-disk"></i> Salvar Alterações</button>
                    <button type="button" class="btn-cancel" onclick="fecharModal()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "https://projeto-empr-stimos-banc-rios-dac-ads-production.up.railway.app";

        function formatarMoeda(campo) {
            let valor = campo.value.replace(/\D/g, "");
            valor = (valor / 100).toFixed(2) + "";
            valor = valor.replace(".", ",");
            valor = valor.replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
            campo.value = "R$ " + valor;
        }

        function formatarTaxa(campo) {
            let valor = campo.value.replace(/\D/g, "");
            valor = (valor / 100).toFixed(2) + "";
            valor = valor.replace(".", ",");
            campo.value = valor + " % a.a.";
        }

        function limparParaBanco(v) {
            return parseFloat(v.replace(/[R$\s%a.a]/g, "").replace(/\./g, "").replace(",", "."));
        }

        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const icon = document.getElementById('btn-icon');
            sidebar.classList.toggle('fechada');
            icon.classList.toggle('fa-bars');
            icon.classList.toggle('fa-arrow-right');
        }

        async function carregarEmprestimos() {
            try {
                const resposta = await fetch(`${API_URL}/listar_emprestimos`);
                const dados = await resposta.json();
                const tabela = document.getElementById("tabelaEmprestimos");
                tabela.innerHTML = "";

                dados.forEach(emp => {
                    const statusClass = emp.status.toLowerCase() === 'ativo' ? 'active' : 'inactive';
                    tabela.innerHTML += `
                        <tr>
                            <td>${emp.credor}</td>
                            <td>R$ ${Number(emp.valor).toLocaleString("pt-BR", { minimumFractionDigits: 2 })}</td>
                            <td>${Number(emp.taxa_juros).toFixed(2)}% a.a.</td>
                            <td>${new Date(emp.data).toLocaleDateString("pt-BR")}</td>
                            <td>${new Date(emp.vencimento).toLocaleDateString("pt-BR")}</td>
                            <td><span class="status ${statusClass}">${emp.status}</span></td>
                            <td>
                                <button class="btn-action edit" onclick="editarEmprestimo(${emp.emprestimo_id})" title="Editar">
                                    <i class="fa-solid fa-pen"></i>
                                </button>
                                <button class="btn-action delete" onclick="excluirEmprestimo(${emp.emprestimo_id})" title="Excluir">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </td>
                        </tr>`;
                });
            } catch (e) { console.error(e); }
        }

        async function editarEmprestimo(id) {
            try {
                // Ajustado para buscar_emprestimo conforme sua rota no server.js
                const resposta = await fetch(`${API_URL}/buscar_emprestimo/${id}`);
                if (!resposta.ok) throw new Error("Empréstimo não encontrado");
                
                const emp = await resposta.json();

                document.getElementById("editId").value = emp.emprestimo_id;
                document.getElementById("editStatus").value = emp.status;
                
                // Preenche e formata o valor
                const campoV = document.getElementById("editValor");
                campoV.value = Number(emp.valor).toFixed(2).replace(".", ",");
                formatarMoeda(campoV);

                // Preenche e formata a taxa (usando taxa_juros do seu banco)
                const campoT = document.getElementById("editTaxa");
                campoT.value = Number(emp.taxa_juros).toFixed(2).replace(".", ",");
                formatarTaxa(campoT);

                document.getElementById("modalEditar").style.display = "block";
            } catch (e) { 
                console.error(e);
                alert("Erro ao carregar dados para edição."); 
            }
        }

        function fecharModal() { document.getElementById("modalEditar").style.display = "none"; }

        document.getElementById("formEditar").onsubmit = async (e) => {
    e.preventDefault();
    const id = document.getElementById("editId").value;
    const dados = {
        valor: limparParaBanco(document.getElementById("editValor").value),
        taxa: limparParaBanco(document.getElementById("editTaxa").value),
        status: document.getElementById("editStatus").value
    };

    // 🛑 TRAVA DO FRONT-END: Alerta visual se o valor passar de 100 milhões
    if (dados.valor > 100000000) {
        alert("❌ O valor do empréstimo não pode ser maior que R$ 100.000.000,00");
        return; // Para a execução aqui e não envia para o servidor
    }

    try {
        const res = await fetch(`${API_URL}/editar_emprestimo/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dados)
        });
        
        // Lê a resposta do servidor caso o back-end barre algo
        const respostaDados = await res.json();

        if (res.ok) { 
            alert("Empréstimo atualizado com sucesso! ✅");
            fecharModal(); 
            carregarEmprestimos(); 
        } else {
            // Exibe a mensagem exata de erro que o back-end enviar
            alert("❌ " + (respostaDados.msg || "Erro ao salvar alterações."));
        }
    } catch (e) { 
        alert("Falha na conexão com o servidor."); 
    }
};

        function gerarPDFEmprestimos() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(18);
            doc.text("Relatório de Empréstimos", 14, 20);
            doc.autoTable({
                html: 'table',
                startY: 30,
                theme: 'striped',
                headStyles: { fillColor: [37, 99, 235] },
                columns: [{header:'Credor'},{header:'Valor'},{header:'Taxa'},{header:'Início'},{header:'Término'},{header:'Status'}],
                columnStyles: { 6: { display: 'none' } } 
            });
            doc.save(`Emprestimos_${new Date().toLocaleDateString()}.pdf`);
        }

        async function excluirEmprestimo(id) {
            if (confirm("Deseja realmente excluir este empréstimo?")) {
                try {
                    const resposta = await fetch(`${API_URL}/excluir_emprestimo/${id}`, { method: 'DELETE' });
                    const res = await resposta.json();
                    alert(res.msg);
                    carregarEmprestimos();
                } catch (e) { console.error(e); }
            }
        }

        function aplicarFiltro() {
            const texto = document.getElementById("buscaCredor").value.toLowerCase();
            const statusSel = document.getElementById("filtroStatus").value;
            const linhas = document.querySelectorAll("#tabelaEmprestimos tr");
            linhas.forEach(linha => {
                const credor = linha.children[0].textContent.toLowerCase();
                const status = linha.children[5].textContent.toLowerCase();
                let mostrar = credor.includes(texto);
                if (statusSel !== "todos" && status !== statusSel) mostrar = false;
                linha.style.display = mostrar ? "" : "none";
            });
        }

        function logout() { localStorage.removeItem("usuarioLogado"); window.location.href = "index.html"; }

        document.getElementById("buscaCredor").addEventListener("keyup", aplicarFiltro);
        document.getElementById("filtroStatus").addEventListener("change", aplicarFiltro);
        
        window.onclick = (event) => {
            if (event.target == document.getElementById("modalEditar")) fecharModal();
        }

        window.onload = carregarEmprestimos;
    </script>
</body>
</html>
