<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios - Impulso Financeiro</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="relatorios.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div class="layout">
        <aside class="sidebar">
            <div class="logo">
                <div id="btn-expandir" onclick="toggleSidebar()" style="cursor: pointer;">
                    <i class="fa-solid fa-bars" id="btn-icon"></i>
                </div>
                <span>Impulso Financeiro</span>
            </div>
            
            <nav>
                <a href="dashboard.html">
                    <i class="fa-solid fa-table-columns"></i>
                    <span>Dashboard</span>
                </a>
                <a href="usuarios.html">
                    <i class="fa-solid fa-users"></i>
                    <span>Cadastro</span>
                </a>
                <a href="financeiras.html">
                    <i class="fa-solid fa-building-columns"></i>
                    <span>Financeiras</span>
                </a>
                <a href="emprestimos.html">
                    <i class="fa-solid fa-hand-holding-dollar"></i>
                    <span>Empréstimos</span>
                </a>
                <a href="notificacoes.html">
                    <i class="fa-solid fa-bell"></i>
                    <span>Notificações</span>
                </a>
                <a href="relatorios.html" class="active">
                    <i class="fa-solid fa-chart-column"></i>
                    <span>Relatórios</span>
                </a>
            </nav>

            <div class="logout">
                <a href="#" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Sair</span>
                </a>
            </div>
        </aside>

        <main class="content">
            <h1>Relatórios</h1>

            <div class="card">
                <h2>Dívida por Credor</h2>
                <table class="tabela-relatorio">
                    <thead>
                        <tr>
                            <th>Credor</th>
                            <th>Saldo Devedor</th>
                            <th>% do Total</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaCredores">
                    </tbody>
                </table>
            </div>

            <div class="card">
                <h2>Fluxo de Caixa</h2>
                <table class="tabela-relatorio">
                    <thead>
                        <tr>
                            <th>Mês</th>
                            <th>Entradas (Previsto)</th>
                            <th>Saídas (Parcelas)</th>
                            <th>Saldo</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaFluxo">
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        // ⭐ CONTROLE DA SIDEBAR DINÂMICA
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const icon = document.getElementById('btn-icon');

            sidebar.classList.toggle('fechada');

            // Troca o ícone conforme o estado
            if (sidebar.classList.contains('fechada')) {
                icon.classList.replace('fa-bars', 'fa-arrow-right');
            } else {
                icon.classList.replace('fa-arrow-right', 'fa-bars');
            }
        }

        // ⭐ CARREGAR RELATÓRIOS DO BACKEND
        async function carregarRelatorios() {
            const BASE_URL = "https://projeto-empr-stimos-banc-rios-dac-ads-production.up.railway.app"; 

            try {
                // 1. CARREGAR DÍVIDA POR CREDOR
                const resCredores = await fetch(`${BASE_URL}/relatorio_credores`);
                const dadosCredores = await resCredores.json();
                const tbodyCredores = document.getElementById("tabelaCredores");
                tbodyCredores.innerHTML = "";

                dadosCredores.forEach(item => {
                    const valor = Number(item.saldo_devedor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                    const perc = Number(item.porcentagem || 0).toFixed(1) + "%";
                    tbodyCredores.innerHTML += `<tr><td>${item.credor}</td><td>${valor}</td><td>${perc}</td></tr>`;
                });

                // 2. CARREGAR FLUXO DE CAIXA
                const resFluxo = await fetch(`${BASE_URL}/relatorio_fluxo`);
                const dadosFluxo = await resFluxo.json();
                const tbodyFluxo = document.getElementById("tabelaFluxo");
                tbodyFluxo.innerHTML = "";

                if (!dadosFluxo || dadosFluxo.length === 0) {
                    tbodyFluxo.innerHTML = "<tr><td colspan='4' style='text-align:center'>Nenhuma parcela encontrada.</td></tr>";
                    return;
                }

                dadosFluxo.forEach(item => {
                    const vEntradas = Number(item.entradas || 0);
                    const vSaidas = Number(item.saidas || 0);
                    const vSaldo = Number(item.saldo || 0);

                    tbodyFluxo.innerHTML += `
                        <tr>
                            <td>${item.mes || '---'}</td>
                            <td>${vEntradas.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</td>
                            <td>${vSaidas.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</td>
                            <td style="color: ${vSaldo < 0 ? 'red' : 'green'}; font-weight: bold;">
                                ${vSaldo.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}
                            </td>
                        </tr>`;
                });

            } catch (e) {
                console.error("Erro ao carregar relatórios:", e);
            }
        }

        // ⭐ LOGOUT
        function logout() { 
            localStorage.removeItem("usuarioLogado"); 
            window.location.href = "index.html"; 
        }

        window.onload = carregarRelatorios;
    </script>
</body>
</html>
