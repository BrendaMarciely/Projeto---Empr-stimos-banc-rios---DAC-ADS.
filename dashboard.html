<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Impulso Financeiro</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div class="layout">
        <aside class="sidebar">
            <div class="logo">
                <div id="btn-expandir" onclick="toggleSidebar()" style="cursor: pointer;">
                    <i class="fa-solid fa-bars" id="btn-icon"></i>
                </div>
                <span>Impulso Financeiro</span>
            </div>
            
            <nav>
                <a href="dashboard.html" class="active">
                    <i class="fa-solid fa-table-columns"></i>
                    <span>Dashboard</span>
                </a>
                <a href="usuarios.html">
                    <i class="fa-solid fa-users"></i>
                    <span>Cadastro</span>
                </a>
                <a href="financeiras.html">
                    <i class="fa-solid fa-building-columns"></i>
                    <span>Financeiras</span>
                </a>
                <a href="emprestimos.html">
                    <i class="fa-solid fa-hand-holding-dollar"></i>
                    <span>Empréstimos</span>
                </a>
                <a href="notificacoes.html">
                    <i class="fa-solid fa-bell"></i>
                    <span>Notificações</span>
                </a>
                <a href="relatorios.html">
                    <i class="fa-solid fa-chart-column"></i>
                    <span>Relatórios</span>
                </a>
            </nav>

            <div class="logout">
                <a href="#" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Sair</span>
                </a>
            </div>
        </aside>

        <main class="content">
            <div class="banner-dashboard">
                <div class="banner-texto">
                    <h1>Dashboard</h1>
                    <p>Visão geral dos seus empréstimos e finanças.</p>
                    <p id="bemVindoUsuario" style="font-weight: bold; margin-top: 10px;"></p>
                </div>
            </div>

            <div class="cards">
                <div class="card">
                    <div class="card-header">
                        <span>Empréstimos Ativos</span>
                        <i class="fa-solid fa-building-columns blue"></i>
                    </div>
                    <div class="card-value" id="cardTotalPedidos">0</div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <span>Total da Dívida</span>
                        <i class="fa-solid fa-dollar-sign red"></i>
                    </div>
                    <div class="card-value" id="cardSomaTotal">R$ 0,00</div>
                </div>

                <div class="card">
    <div class="card-header">
        <span>Parcelas Próximas</span>
        <i class="fa-solid fa-calendar-check orange"></i>
    </div>
    <div class="card-value" id="cardParcelasProximas">0</div> <p>Nos próximos 30 dias</p>
</div>
                <div class="card">
                    <div class="card-header">
                        <span>Bancos Parceiros</span>
                        <i class="fa-solid fa-landmark blue"></i>
                    </div>
                    <div class="card-value" id="cardQtdCredores">0</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 🏁 CONFIGURAÇÃO DA URL 
        const API_URL = "https://projeto-empr-stimos-banc-rios-dac-ads-production.up.railway.app";

        // ⭐ CONTROLE DA SIDEBAR DINÂMICA
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const icon = document.getElementById('btn-icon');
            sidebar.classList.toggle('fechada');

            if (sidebar.classList.contains('fechada')) {
                icon.classList.replace('fa-bars', 'fa-arrow-right');
            } else {
                icon.classList.replace('fa-arrow-right', 'fa-bars');
            }
        }

        // ⭐ MOSTRAR NOME DO USUÁRIO
        const usuarioObj = JSON.parse(localStorage.getItem("usuarioLogado"))
        if (usuarioObj) {
            document.getElementById("bemVindoUsuario").innerText = "Bem-vindo(a), " + usuarioObj.nome
        }

        // ⭐ CARREGAR DADOS REAIS DO BANCO
        async function carregarDashboard() {
    try {
        const resposta = await fetch(`${API_URL}/dashboard_resumo`);
        const dados = await resposta.json();

        // 1. Atualiza Empréstimos Ativos (Agora filtrado pelo SQL)
        document.getElementById("cardTotalPedidos").innerText = dados.total_pedidos || 0;
        
        // 2. Atualiza Bancos Parceiros
        document.getElementById("cardQtdCredores").innerText = dados.total_credores || 0;

        // 3. Atualiza Parcelas Próximas (Dinâmico)
        document.getElementById("cardParcelasProximas").innerText = dados.parcelas_proximas || 0;

        // 4. Atualiza Total da Dívida (Apenas dos Ativos)
        const valorTotal = Number(dados.soma_total || 0).toLocaleString('pt-BR', {
            style: 'currency',
            currency: 'BRL'
        });
        document.getElementById("cardSomaTotal").innerText = valorTotal;

    } catch (e) {
        console.error("Erro ao carregar dashboard:", e);
    }
}

        // ⭐ LOGOUT REAL
        function logout() {
            localStorage.removeItem("usuarioLogado")
            window.location.href = "index.html"
        }

        window.onload = carregarDashboard;
    </script>
</body>
</html>
